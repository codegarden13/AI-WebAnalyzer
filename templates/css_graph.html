<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS + HTML Graph Visualizer</title>

  <!-- Styles -->
  <link rel="stylesheet" href="./assets/css/style.css">

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
    }

    #graph {
      width: 100vw;
      height: 100vh;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #eee;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 10;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 240px;
    }

    #filterInput {
      width: 100%;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      margin-top: 4px;
    }

    #legend span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="controls">
   
    <input id="filterInput" type="text" placeholder="Filter (regex e.g. .hero|#nav)">
    <div id="legend"></div>
  </div>

  <div id="graph"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
